# При пуше тега вида v0.3.9:
#  - собирает movian-kinopub-<версия>.zip и публикует его в GitHub Release (единственный файл в Assets);
#  - обновляет dist/kinopub.zip и plugins-v1.json в ветке main: на них ссылается репозиторий плагинов Movian.
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Проверка
        run: make check
      - name: Версия в plugin.json должна совпадать с тегом
        run: |
          v=$(sed -n 's/.*"version": *"\([^"]*\)".*/\1/p' plugin.json)
          test "v$v" = "${GITHUB_REF_NAME}" || { echo "plugin.json: $v, тег: ${GITHUB_REF_NAME}"; exit 1; }
      - name: Сборка
        run: make
      - name: Публикация релиза
        uses: softprops/action-gh-release@v2
        with:
          files: movian-kinopub-*.zip
          generate_release_notes: true
      - name: Обновить dist/kinopub.zip и plugins-v1.json в main
        run: |
          git fetch origin main
          git checkout main
          make -B dist/kinopub.zip
          make repo REPO="${GITHUB_REPOSITORY}"
          if git diff --quiet -- dist/kinopub.zip plugins-v1.json; then echo "без изменений"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/kinopub.zip plugins-v1.json
          git commit -m "Релиз ${GITHUB_REF_NAME}: dist/kinopub.zip и plugins-v1.json"
          git push origin main
